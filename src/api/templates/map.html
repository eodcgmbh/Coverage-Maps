<!DOCTYPE html>
<html lang="en">
<head>
<title>Coverage Map</title>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

<!-- Leaflet CSS -->
<link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet" />

<style>
  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
  }
  .padded {
  padding: 5px;
}

  #map {
    height: 100vh;
    width: 100%;
    transition: margin-left 0.3s ease;
  }
  #sidebar {
    position: fixed;
    top: 0; left: 0;
    height: 100vh;
    width: 350px;
    background: #f8f9fa;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    padding: 20px;
    box-shadow: 2px 0 5px rgba(0,0,0,0.1);
    transition: transform 0.3s ease;
    z-index: 1050;
  }
  #sidebar.closed {
    transform: translateX(-100%);
  }
  #toggleSidebarBtn {
    position: fixed;
    top: 15px;
    right: 15px;
    z-index: 1100;
  }
  .colorbar {
    border-radius: 6px;
  }
  .colorbar .gradient {
    width: 100%;
    height: 15px;
    background: linear-gradient(to right, hsl(60,100%,50%), hsl(0,100%,30%));
    margin-bottom: 5px;
  }
  .colorbar .labels {
    display: flex;
    justify-content: space-between;
  }
  #opacityRange {
    -webkit-appearance: none;
    width: 100%;
    height: 8px;
    border-radius: 5px;
    background: white;
    padding:5px;
    border: 1px solid #999;
    outline: none;
    cursor: pointer;
    margin-top: 5px;
  }
  #opacityRange::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #343a40;
    border: 2px solid #f8f9fa;
    cursor: pointer;
    transition: background 0.3s ease;
    margin-top: -6px;
  }
  #opacityRange::-webkit-slider-thumb:hover {
    background: #495057;
  }
  #opacityRange::-moz-range-thumb {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #343a40;
    border: 2px solid #f8f9fa;
    cursor: pointer;
    transition: background 0.3s ease;
  }
  #opacityRange::-moz-range-thumb:hover {
    background: #495057;
  }
  #downloadBtn {
    margin-top: auto;
    padding: 10px 0;
    font-weight: 600;
    border-radius: 5px;
    transition: background-color 0.3s ease;
  }
  #downloadBtn:disabled {
    cursor: not-allowed !important;
    pointer-events: none;
    opacity: 0.6;
  }
</style>
</head>
<body>

<button id="toggleSidebarBtn" class="btn btn-primary">☰ Filters</button>

<div id="sidebar" class="closed">
  <h1 class="mb-4">Coverage Map</h1>

  <form id="paramForm" onsubmit="event.preventDefault(); submitForm();">
    <div class="mb-3">
      <label for="from_date" class="form-label">From Date:</label>
      <input type="datetime-local" class="form-control" id="from_date" name="from_date" required />
    </div>

    <div class="mb-3">
      <label for="to_date" class="form-label">To Date:</label>
      <input type="datetime-local" class="form-control" id="to_date" name="to_date" required />
    </div>

    <div class="mb-3">
      <label for="collection" class="form-label">Collection:</label>
      <select id="collection" name="collection" class="form-select" required>
        <option value="" disabled selected>Loading collections...</option>
      </select>
    </div>

    <div class="row g-2 mb-3">
      <div class="col-6">
        <label for="lonmin" class="form-label">Lon Min:</label>
        <input type="number" class="form-control" id="lonmin" name="lonmin" value="-180" step="0.1" />
      </div>
      <div class="col-6">
        <label for="latmin" class="form-label">Lat Min:</label>
        <input type="number" class="form-control" id="latmin" name="latmin" value="-90" step="0.1" />
      </div>
      <div class="col-6">
        <label for="lonmax" class="form-label">Lon Max:</label>
        <input type="number" class="form-control" id="lonmax" name="lonmax" value="180" step="0.1" />
      </div>
      <div class="col-6">
        <label for="latmax" class="form-label">Lat Max:</label>
        <input type="number" class="form-control" id="latmax" name="latmax" value="90" step="0.1" />
      </div>
    </div>

    <button id="loadBtn" type="submit" class="btn btn-primary w-100 d-flex justify-content-center align-items-center gap-2">
      <span id="loadBtnText">Load Coverage</span>
      <div id="loadingSpinner" class="spinner-border spinner-border-sm text-light" 
          role="status" style="display:none;">
      </div>
    </button>

  </form>

  <hr />

    <h5>Overlapping Scenes</h5>
    <div id="sidebarColorbar" class="colorbar">
    <div class="gradient"></div>
    <div class="labels">
      <span id="colorbarMin">0</span>
      <span id="colorbarMax">1</span>
    </div>
    </div>

    <h5 class="mt-4">Observed Scenes:</h5>
    <div id="observedScenesValue" class="observed-scenes-value">
    0
    </div>

    <h5 class="mt-4">Layer Opacity</h5>
    <div class="mb-3 mt-2 opacity-control">
    <input type="range" id="opacityRange" min="0" max="100" step="1" value="70" />
    <div class="opacity-labels d-flex justify-content-between mt-1">
        <span>0</span>
        <span>100</span>
    </div>
    </div>


  <button id="downloadBtn" class="btn btn-secondary w-100 mt-2" disabled>Download Coverage.geojson</button>
</div>

<div class="modal fade" id="errorModal" tabindex="-1" aria-labelledby="errorModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-danger text-white">
        <h5 class="modal-title" id="errorModalLabel">Error</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" id="errorModalBody"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>

<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Bootstrap Bundle JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
  const sidebar = document.getElementById('sidebar');
  const toggleBtn = document.getElementById('toggleSidebarBtn');
  const mapDiv = document.getElementById('map');
  let lastGeojsonData = null;

  toggleBtn.onclick = () => {
    sidebar.classList.toggle('closed');
    mapDiv.style.marginLeft = sidebar.classList.contains('closed') ? '0' : '350px';
    map.invalidateSize();
  };

  const map = L.map('map').setView([30, 0], 3);
  let minVal = 0;
  let maxVal = 1;
  let geojsonLayer = null;

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
  }).addTo(map);

  function getColor(value) {
    const ratio = (value - minVal) / (maxVal - minVal);
    const hue = 55 - ratio * 55;
    const saturation = 50;
    const lightness = 75 - ratio * 25;
    return `hsl(${hue}, ${saturation}%, ${lightness}%)`;
  }

  function style(feature) {
    return {
      fillColor: getColor(feature.properties.count),
      weight: 1,
      opacity: 0.7,
      color: getColor(feature.properties.count),
      dashArray: '3',
      fillOpacity: 0.7,
    };
  }

  function addColorbar(min, max) {
    document.getElementById('colorbarMin').textContent = min.toFixed(2);
    document.getElementById('colorbarMax').textContent = max.toFixed(2);
  }

  document.getElementById('opacityRange').addEventListener('input', (event) => {
    const opacity = parseInt(event.target.value, 10) / 100;
    if (geojsonLayer) {
      geojsonLayer.setStyle({ fillOpacity: opacity, opacity: opacity });
    }
  });

  window.onload = function () {
    fetch('/collection')
      .then(response => {
        if (!response.ok) throw new Error('Failed to load collections');
        return response.json();
      })
      .then(collections => {
        const select = document.getElementById('collection');
        select.innerHTML = '';
        if (collections.length === 0) {
          const opt = document.createElement('option');
          opt.value = '';
          opt.textContent = 'No collections found';
          opt.disabled = true;
          select.appendChild(opt);
          return;
        }
        const placeholder = document.createElement('option');
        placeholder.value = '';
        placeholder.textContent = 'Select a collection';
        placeholder.disabled = true;
        placeholder.selected = true;
        select.appendChild(placeholder);

        collections.forEach(c => {
          const option = document.createElement('option');
          option.value = c;
          option.textContent = c;
          select.appendChild(option);
        });
      })
      .catch(err => {
        console.error(err);
        const errorModalBody = document.getElementById('errorModalBody');
        errorModalBody.textContent = "Failed to connect to STAC. Check if STAC is running!";

        const errorModal = new bootstrap.Modal(document.getElementById('errorModal'));
        errorModal.show();
      });


  };

  console.log({
    observedScenesValue: document.getElementById('observedScenesValue'),
    downloadBtn: document.getElementById('downloadBtn'),
    colorbarMin: document.getElementById('colorbarMin'),
    colorbarMax: document.getElementById('colorbarMax')
  });


  document.getElementById('downloadBtn').addEventListener('click', () => {
    if (!lastGeojsonData) return;
    const blob = new Blob([JSON.stringify(lastGeojsonData, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'coverage.geojson';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 0);
  });

    const lonMinLimit = -180;
    const lonMaxLimit = 180;
    const latMinLimit = -90;
    const latMaxLimit = 90;
    const step = 0.5;

    function clamp(value, min, max) {
    return Math.min(Math.max(value, min), max);
    }

    function snapToStep(value, step) {
    return Math.round(value / step) * step;
    }

    map.on('moveend', () => {
    const bounds = map.getBounds();

    // Snap and clamp
    const west = clamp(snapToStep(bounds.getWest(), step), lonMinLimit, lonMaxLimit);
    const south = clamp(snapToStep(bounds.getSouth(), step), latMinLimit, latMaxLimit);
    const east = clamp(snapToStep(bounds.getEast(), step), lonMinLimit, lonMaxLimit);
    const north = clamp(snapToStep(bounds.getNorth(), step), latMinLimit, latMaxLimit);

    document.getElementById('lonmin').value = west.toFixed(1);
    document.getElementById('latmin').value = south.toFixed(1);
    document.getElementById('lonmax').value = east.toFixed(1);
    document.getElementById('latmax').value = north.toFixed(1);
    });


  function submitForm() {
    lastGeojsonData = null;
    document.getElementById('downloadBtn').disabled = true;
    const spinner = document.getElementById('loadingSpinner');
    spinner.style.display = 'inline-block';

    const formData = new FormData(document.getElementById('paramForm'));
    const params = new URLSearchParams();
    for (const [key, value] of formData.entries()) {
      if (value) params.append(key, value);
    }

    const fromDate = params.get("from_date");
    const toDate = params.get("to_date");

    fetch('/coverage?' + params.toString())
      .then(response => {
        if (!response.ok) 
          return response.json().then(errData => {
            throw new Error(errData.message || "Unknown error occurred");
          });
      
        return response.json();
      })
      .then(data => {
        if (geojsonLayer) {
          map.removeLayer(geojsonLayer);
        }
        lastGeojsonData = data;

        if (data.total_count === 0) {
          // Show modal saying no data available
          const errorModalBody = document.getElementById('errorModalBody');
          errorModalBody.textContent = data.message || "No data available for the selected area or date range.";

          const errorModal = new bootstrap.Modal(document.getElementById('errorModal'));
          errorModal.show();

          return; // Stop further processing
        }

        if (data.total_count !== undefined) {
            document.getElementById('observedScenesValue').textContent = data.total_count;
        } else {
            document.getElementById('observedScenesValue').textContent = '0';
        }
        if (data?.features?.length > 0) {
          document.getElementById('downloadBtn').disabled = false;

          const counts = data.features.map(f => f.properties.count);
          minVal = Math.min(...counts);
          maxVal = Math.max(...counts);

          addColorbar(minVal, maxVal);

          geojsonLayer = L.geoJSON(data, {
            style,
            onEachFeature: (feature, layer) => {

              const bounds = layer.getBounds();
              const sw = bounds.getSouthWest();
              const ne = bounds.getNorthEast();

              const collection = document.getElementById('collection').value;
              const from_date = document.getElementById('from_date').value;
              const to_date = document.getElementById('to_date').value;
              const bbox = `${sw.lng},${sw.lat},${ne.lng},${ne.lat}`;
              const API_BASE = "{{ api_base }}";
              const link = `<a href="${API_BASE}search?collections=${collection}&bbox=${bbox}&datetime=${from_date}:00Z/${to_date}:00Z" target="_blank">
                              STAC link
                            </a>`;

              let popupContent = "";

              if (feature.properties?.count !== undefined) {
                popupContent += `Count: ${feature.properties.count}<br>`;
              }

              popupContent += `Bbox: ${bbox}<br>${link}`;

              layer.bindPopup(popupContent);
            }
          }).addTo(map);

          if (geojsonLayer.getBounds().isValid()) {
            map.fitBounds(geojsonLayer.getBounds());
          }
        } else {
          document.getElementById('downloadBtn').disabled = true;
        }
        
      })
      .catch(err => {
        console.error(err);

        const errorModalBody = document.getElementById('errorModalBody');
        // Display the server's error message
        errorModalBody.textContent = err.message;

        const errorModal = new bootstrap.Modal(document.getElementById('errorModal'));
        errorModal.show();
      })
      .finally(() => {
        spinner.style.display = 'none';
       });
  }
</script>

</body>
</html>
